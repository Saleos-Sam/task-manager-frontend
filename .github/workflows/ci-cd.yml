name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'task-manager-frontend-master/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'task-manager-frontend-master/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/task-manager-frontend
  KUBERNETES_NAMESPACE: task-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: task-manager-frontend-master/package-lock.json

    - name: Install dependencies
      run: |
        cd task-manager-frontend-master
        npm ci

    - name: Run tests
      run: |
        cd task-manager-frontend-master
        npm test -- --coverage --watchAll=false

    - name: Build application
      run: |
        cd task-manager-frontend-master
        npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager-frontend-master
        file: ./task-manager-frontend-master/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes
      run: |
        # Update image tag in deployment
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" Task-Manager-Deploy/dev/k8s/task_manager_frontend_deployment.yml
        
        # Apply deployment
        kubectl apply -f Task-Manager-Deploy/dev/k8s/task_manager_frontend_deployment.yml
        
        # Wait for rollout
        kubectl rollout status deployment/task-manager-frontend -n ${{ env.KUBERNETES_NAMESPACE }}

    - name: Verify deployment
      run: |
        kubectl get pods -l app=task-manager-frontend -n ${{ env.KUBERNETES_NAMESPACE }}
        kubectl get services -n ${{ env.KUBERNETES_NAMESPACE }}


